[tool.ruff]
src = ["amf/amf_code"]
exclude = ["amf/analysis_code", "*.ipynb"]

[tool.ruff.lint]
extend-select = [
    "A",    # overwriting builtins
    "ARG",  # unused arguments
    "E501", # line too long
    "I",    # import sorting
    "S101"  # no assert statements
]

[tool.mypy]
files = ["amf/amf_code"]
exclude = ["amf/analysis_code"]
strict = true
disable_error_code = ["import-untyped"]
warn_unreachable = true
